# Feishu (Lark) application bot
lark:
  app_id: ""
  app_secret: ""
  target_chat_id: ""
  template_id: "AAqWNxGgDjV5N"
  template_version_name: "1.0.2"
  main_card_batch_size: 50

# Paper discovery and local state
paper:
  tag: "Embodied Intelligence"
  categories:
    - cs.RO
    - cs.AI
    - cs.CV
    - cs.LG
    - cs.GR
    - eess.SY
  max_results_per_category: 100
  history_file: "papers.json"
  seen_file: "seen_papers.json"
  criteria_file: "paper_to_hunt.md"

# Public OpenAI SDK-compatible service
llm:
  model: "your-model"
  base_url: "https://your-openai-compatible-api.example/v1"
  api_key: ""
  # Optional per-stage overrides; null falls back to `model`.
  related_model: null
  recommendation_model: null
  reading_model: null
  related_max_tokens: 800
  recommendation_max_tokens: 1200
  reading_chunk_max_tokens: 1500
  reading_max_tokens: 3000

recommendation:
  related_batch_size: 10
  selection_batch_size: 30
  max_recommendations: 5

reading:
  pdf_timeout_seconds: 30
  chunk_characters: 12000
  cache_dir: "reading_cache"
