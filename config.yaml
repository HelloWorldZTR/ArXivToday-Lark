# Feishu (Lark) delivery
lark:
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/XXXXX"
  template_id: "XXXXX"
  template_version_name: "1.0.0"

# Paper discovery and local storage
paper:
  tag: "LLM Security"
  categories:
    - cs.CL
    - cs.AI
    - cs.CV
    - cs.CR
    - cs.LG
  keywords:
    - safety
    - security
    - jailbreak
    - adversarial
    - moderation
    - guard
    - alignment
    - backdoor
    - hallucination
    - privacy
    - intellectual property
    - vulnerability
    - vulnerabilities
    - poison
    - victim
  max_results_per_category: 100
  history_file: "papers.json"
  criteria_file: "paper_to_hunt.md"

# OpenAI SDK-compatible service (including Ollama)
llm:
  model: "deepseek-r1:32b"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"

features:
  llm_filtering: true
  llm_translation: true
